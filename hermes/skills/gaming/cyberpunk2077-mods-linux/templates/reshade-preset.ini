; ReShade preset for Cyberpunk 2077 (patch 2.5+, path tracing, DLSS on).
; Copy next to bin/x64/dxgi.dll, point [GENERAL] PresetPath at it in ReShade.ini.
; Comment out (or move) any block whose effect is not in reshade-shaders/Shaders —
; a preset referencing a missing effect silently contributes nothing.
; F10 toggles the whole chain in game for an instant A/B; Home opens the editor.

PreprocessorDefinitions=
Techniques=Deband,Tonemap,Curves,Vibrance,ContrastAdaptiveSharpen
TechniqueSorting=SMAA,LumaSharpen,Deband,Tonemap,Curves,Levels,Vibrance,ContrastAdaptiveSharpen

; Gradients first: path-traced fog and sky band badly at 8-bit output.
; iterations=2 for a cleaner ramp, still cheap at 1600p.
[Deband.fx]
enable_weber=1
enable_sdeviation=0
enable_depthbuffer=0
t1=0.006000
t2=0.030000
banding_depth=0.000000
range=16.000000
iterations=2
debug_output=0
drandom=0

; Filmic shoulder with a touch of defog. Keep Exposure 0 — brighten in game,
; not here, or the grade fights the tone mapper.
[Tonemap.fx]
Gamma=1.000000
Exposure=0.000000
Saturation=1.030000
Bleach=0.050000
Defog=0.030000
FogColor=0.020000,0.020000,0.030000

; Mild S-curve. Curves.fx has no per-channel control, so no teal/orange split
; here — adding it needs a LUT effect.
[Curves.fx]
Mode=2
Formula=1
Contrast=0.060000

; Not in the chain by default: Levels is a blunt instrument for this game.
[Levels.fx]
BlackPoint=0
WhitePoint=255
HighlightClipping=0

; Saturation only where it is missing; already-neon areas stay put.
[Vibrance.fx]
Vibrance=0.150000
VibranceRGBBalance=1.000000,1.000000,1.000000
Vibrance_Luma=1

; Contrast-adaptive, so edges do not halo. Above ~0.5 the dithering/gravel
; texture in asphalt starts to sparkle.
[ContrastAdaptiveSharpen.fx]
Contrast=0.000000
Sharpening=0.350000

; Only for TAA-off / no upscaler play — SMAA after DLSS just softens.
[SMAA.fx]
EdgeDetectionType=1
EdgeDetectionThreshold=0.100000
DepthEdgeDetectionThreshold=0.000000
MaxSearchSteps=32
MaxSearchStepsDiagonal=16
CornerRounding=25
PredicationEnabled=1
PredicationThreshold=0.010000
PredicationScale=2.000000
PredicationStrength=0.400000
DebugOutput=0

[LumaSharpen.fx]
sharp_strength=0.700000
sharp_clamp=0.035000
pattern=1
offset_bias=1.000000
show_sharpen=0
inversedAttribution=1
